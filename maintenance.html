        body {

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;

        .container {

        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {

                transform: translateY(0);
            }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 15px;

            margin-bottom: 10px;
        }

        .timer-display {
            font-size: 24px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .features {
            text-align: right;
            margin: 40px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin: 15px 0;
            color: #555;
        }

        .feature-item .icon-small {

        .contact {
            background: #e8f4f8;
            border-right: 4px solid #667eea;
            padding: 20px;
            border-radius: 10px;

        .social-links {
            margin-top: 40px;
            display: flex;

            justify-content: center;
            flex-wrap: wrap;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f0f0f0;
            color: #667eea;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .social-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 100%;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0%, 100% {
                width: 100%;
                opacity: 1;
            }

                opacity: 0.7;

    <script>
        // عداد التنازل (Countdown Timer)
        function updateCountdown() {
            // اضبط الوقت المتوقع للعودة (غيّر الساعة إلى وقتك المتوقع)
            const returnTime = new Date();
            returnTime.setHours(returnTime.getHours() + 2); // العودة بعد ساعتين
            
            function calculate() {
                const now = new Date().getTime();
                const distance = returnTime.getTime() - now;

                if (distance < 0) {
                    document.getElementById('countdown').innerHTML = 'نحن هنا الآن! يرجى تحديث الصفحة';
                    return;
                }

                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('countdown').innerHTML = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }

            calculate();
            setInterval(calculate, 1000);
        }

        updateCountdown();

        // تحديث الصفحة تلقائياً كل 30 ثانية
        setTimeout(() => {
            location.reload();
        }, 30000);
